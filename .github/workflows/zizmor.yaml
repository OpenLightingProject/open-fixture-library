name: Zizmor
on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fork PRs get a read-only token, where SARIF upload is not guaranteed
          # to work. Fall back to console output there; findings then fail the
          # job. Same-repo PRs and master pushes upload SARIF and stay green.
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
