name: External Links Checker
on:
  schedule:
    - cron: '30 18 * * *' # everyday 18:30 UTC
  workflow_dispatch:
jobs:
  external-links:
    name: Check external links
    if: github.repository == 'OpenLightingProject/open-fixture-library'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js v26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - parallel:
          - name: Check external links
            run: npm run test:external-links
            env:
              GITHUB_USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_BROKEN_LINKS_ISSUE_NUMBER: 999
              NODE_ENV: production
          - name: Check Markdown Links in all files
            uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
            with:
              use-verbose-mode: 'yes'
