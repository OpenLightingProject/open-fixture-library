name: AgentScan

on:
  pull_request_target:
    types:
      - opened
      - reopened
    branches:
      - master
  issues:
    types:
      - opened

jobs:
  agentscan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.repository == 'OpenLightingProject/open-fixture-library'
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@7ad606f1e21df2119da8be99b763f282a670a1c5 # v2.8.0
        with:
          scan-pull-requests: true
          scan-issues: true
          trusted-author-associations: "owner,member"
          mode: labels
          label-community-flagged: "ai-assisted"
          label-mixed: "ai-assisted"
          label-automation: "ai-assisted"
