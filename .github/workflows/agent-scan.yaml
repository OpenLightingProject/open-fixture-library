name: AgentScan

on:
  pull_request_target:
    types:
      - opened
      - reopened
    branches:
      - master
  issues:
    types:
      - opened

jobs:
  agentscan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: github.repository == 'OpenLightingProject/open-fixture-library'
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: AgentScan
        uses: MatteoGabriele/agentscan-action@3e61e47813567b9a9a5b7944a14f3eb0798ffd1b # v2.6.0
        with:
          scan-pull-requests: true
          scan-issues: true
          trusted-author-associations: "owner,member"
          mode: labels
          label-community-flagged: "ai-assisted"
          label-mixed: "ai-assisted"
          label-automation: "ai-assisted"
